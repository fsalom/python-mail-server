services:
  app:
    container_name: app
    build:
      context: ..
      dockerfile: .docker/app/Dockerfile
    ports:
      - "8000:8000"  # Puerto para Django
      - "8001:8001"  # Puerto para FastAPI
    env_file: 'environments/staging.env'
    image: 'websource'
    volumes:
      - mediadata:/media
      - staticdata:/static
    depends_on:
      - postgres
    networks:
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"       # Limita el tamaño de cada archivo de log a 10 MB
        max-file: "3"

  postgres:
    container_name: 'postgres'
    restart: always
    image: 'postgres:16.3'
    env_file: 'environments/staging.env'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    networks:
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"       # Limita el tamaño de cada archivo de log a 10 MB
        max-file: "3"

  nginx:
    container_name: 'nginx'
    restart: always
    build: 'nginx/dev'
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - URL=tickets.rudo.es
      - SUBDOMAINS=www,
      - VALIDATION=http
      - EMAIL=fdosalom@gmail.com
    volumes:
      - 'nginx:/config'
    depends_on:
      - app
    ports:
      - '443:443'
      - '80:80'
    networks:
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx:
  pgdata:
  mediadata:
  staticdata:

networks:
  dashboard:
