name: Deploy to DigitalOcean
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install SSH client
      run: sudo apt-get install -y openssh-client

    - name: Add SSH key and set permissions
      run: |
        echo "${{ secrets.DROPLET_SSH_KEY }}" | tr -d '\r' > key.pem
        chmod 600 key.pem

    - name: Clone repository on server
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "
        rm -rf /root/app
        git clone https://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@github.com/fsalom/python-mail-server.git /root/app;
        "
    - name: Install docker
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "
        if ! command -v docker &> /dev/null; then            
            curl -fsSL https://get.docker.com | sudo bash
        else
            docker --version
        fi"

    - name: Install docker-compose V2
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "
        if ! command -v docker-compose &> /dev/null; then            
            curl -L "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        else
            docker --version
        fi"

    - name: Change permissions for docker-compose
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "chmod +x /usr/local/bin/docker-compose"

    - name: Clean old images
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "docker image prune -a -f"

    - name: Clean old volumes
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "docker volume prune -a -f"

    - name: Clean old docker data
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "docker system prune -a --volumes -f"

    - name: Build application using docker-compose
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "cd /root/app && docker compose -f .docker/staging.yml up --build -d"

    - name: Deploy application using docker-compose
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "cd /root/app && docker compose -f .docker/staging.yml up -d"

    - name: Docker ps
      run: ssh -o StrictHostKeyChecking=no -i key.pem root@"${{ secrets.DROPLET_IP }}" "docker ps"

    - name: Clean up SSH key
      run: rm -f key.pem
